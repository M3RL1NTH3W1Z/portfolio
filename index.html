<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERLIN-4 // SIGNAL STATION</title>
<!-- VT323 is the standard "Hacker Terminal" font -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
  :root {
    --bg-color: #050505;
    --term-green: #33ff00; /* Classic phosphor green */
    --term-blue: #00e5ff;  /* Signal blue */
    --term-warn: #ffaa00;  /* COMSEC amber */
    --term-glow: 0 0 10px rgba(51, 255, 0, 0.4);
  }

  body {
    background-color: var(--bg-color);
    color: var(--term-green);
    font-family: 'VT323', monospace;
    font-size: 22px;
    margin: 0;
    padding: 20px;
    height: 100vh;
    overflow: hidden; /* We scroll the terminal div, not the body */
    text-shadow: var(--term-glow);
  }

  /* CRT SCREEN EFFECTS */
  .scanline {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), 
                linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
    background-size: 100% 3px, 3px 100%;
    pointer-events: none;
    z-index: 10;
  }
  
  .flicker-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(18, 16, 16, 0.1);
    opacity: 0;
    z-index: 10;
    pointer-events: none;
    animation: flicker 0.15s infinite;
  }

  /* TERMINAL CONTAINER */
  #terminal {
    max-width: 1000px;
    margin: 0 auto;
    height: 100%;
    overflow-y: auto; /* Scrollbar logic */
    scrollbar-width: none; /* Firefox hide */
  }
  #terminal::-webkit-scrollbar { display: none; /* Chrome hide */ }

  /* ASCII ART & TEXT */
  pre {
    margin: 0;
    font-family: inherit;
    white-space: pre-wrap; /* Mobile wrapping */
    line-height: 1.1;
  }

  #banner {
    color: var(--term-blue);
    font-weight: bold;
    margin-bottom: 20px;
    white-space: pre; /* Force strict ASCII spacing */
  }

  .output-line {
    margin-bottom: 5px;
    word-wrap: break-word;
  }

  /* INPUT LINE STYLING */
  .input-wrapper {
    display: flex;
    align-items: center;
    margin-top: 10px;
  }

  .prompt {
    color: var(--term-green);
    margin-right: 8px;
    white-space: nowrap;
  }

  /* The actual input is transparent but sits on top of the text area */
  #cmd-input {
    background: transparent;
    border: none;
    color: var(--term-green);
    font-family: 'VT323', monospace;
    font-size: 22px;
    flex-grow: 1;
    outline: none;
    text-shadow: var(--term-glow);
    caret-color: var(--term-green); /* The blinking cursor block */
    text-transform: lowercase;
  }

  /* UTILITY COLORS */
  .c-blue { color: var(--term-blue); text-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }
  .c-warn { color: var(--term-warn); }
  .c-white { color: #fff; }
  .c-dim { color: #555; }

  @keyframes flicker {
    0% { opacity: 0.02; }
    50% { opacity: 0.05; }
    100% { opacity: 0.02; }
  }
</style>
</head>
<body>

<!-- VISUAL OVERLAYS -->
<div class="scanline"></div>
<div class="flicker-overlay"></div>

<!-- MAIN TERMINAL AREA -->
<div id="terminal">
    <!-- ASCII ART ANIMATION CONTAINER -->
    <pre id="banner"></pre>
    
    <div class="output-line">MERLIN-4 [Version 17C.GUARD.4.0]</div>
    <div class="output-line c-dim">Connected to secure node: merlinthewiz.sh</div>
    <div class="output-line c-dim">Type <span class="c-warn">'help'</span> to initialize connection protocols.</div>
    <br>

    <!-- COMMAND HISTORY -->
    <div id="history"></div>

    <!-- ACTIVE INPUT LINE -->
    <div class="input-wrapper">
        <span class="prompt">merlin@wiz-term:~$</span>
        <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
    </div>
</div>

<script>
    /* --- 1. THE SIGNAL ANIMATION ENGINE --- */
    const bannerEl = document.getElementById('banner');
    
    // Frame 0: Quiet
    // Frame 1: Low Signal
    // Frame 2: Mid Signal
    // Frame 3: High Signal
    const frames = [
`
       
       
       / \\
      /   \\
     /_____\\
    ( MERLIN )
`,
`
        .
       
       / \\
      /   \\
     /_____\\
    ( MERLIN )
`,
`
      . o .
        ^
       / \\
      /   \\
     /_____\\
    ( MERLIN )
`,
`
    ( . o . )
        ^
       / \\
      /   \\
     /_____\\
    ( MERLIN )
`
    ];

    let frameIndex = 0;
    // Animate at 250ms for that retro "refresh rate" feel
    setInterval(() => {
        bannerEl.textContent = frames[frameIndex];
        frameIndex = (frameIndex + 1) % frames.length;
    }, 250);


    /* --- 2. TERMINAL LOGIC --- */
    const terminal = document.getElementById('terminal');
    const input = document.getElementById('cmd-input');
    const history = document.getElementById('history');

    // Data Store
    const fileSystem = {
        "bio.txt": "IDENTITY: MERLIN-4\n------------------\nROLE: 17C Cyber Ops (National Guard)\nORIGIN: USMC Radio Operator / COMSEC Custodian\nGOAL: Finding what usually isn't sought after // testing on what's forgotten.",
        "skills.md": "[HARDWARE:UNDER DEVELOPMENT]\n- Bus Pirate / JTAG Debugging\n- PCB Analysis (KiCad)\n- RF Signals (SDR/GNU Radio)\n\n[CODE]\n- Python\n- Golang\n- Bash\n\n[CERTIFICATIONS]\n- CompTIA A+\n- CompTIA Net+\n- CompTIA Sec+(701)\n- LPI Linux Essentials\n- ITIL v4 Foundations",
        "projects": "drwx------  cobol-ghost\ndrwx------  hardware-wizard\ndrwx------  signals-comsec\n-rw-r--r--  bare-metal.asm",
        "contact": "SECURE DROP: merlin@merlinthewiz.sh"
    };

    // Command Parser
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const cmdRaw = input.value;
            const cmd = cmdRaw.trim().toLowerCase();
            const args = cmd.split(' ');

            // 1. Create specific HTML for the user's entered command
            const userLine = document.createElement('div');
            userLine.className = 'output-line';
            userLine.innerHTML = `<span class="prompt">merlin@merlinthewiz.sh:~$</span> ${cmdRaw}`;
            history.appendChild(userLine);

            // 2. Process Response
            let response = "";
            
            switch (args[0]) {
                case 'help':
                    response = `COMMAND LIST:
  <span class="c-warn">ls</span>            List directory contents
  <span class="c-warn">cd</span>            Change directory (needs work) 
  <span class="c-warn">cat [file]</span>    Read text file (e.g., 'cat bio.txt')
  <span class="c-warn">rf-scan</span>       Simulate signal interception
  <span class="c-warn">clear</span>         Clear terminal screen
  <span class="c-warn">whoami</span>        Print user identity`;
                    break;
                
                case 'ls':
                    response = `<span class="c-blue">bio.txt</span>   <span class="c-blue">skills.md</span>   <span class="c-blue">contact</span>   <span class="c-warn">projects.txt</span>`;
                    break;

                case 'cat':
                    if (fileSystem[args[1]]) {
                        response = fileSystem[args[1]];
                    } else if (!args[1]) {
                        response = "Usage: cat [filename] (hint: try 'cat bio.txt')";
                    } else {
                        response = `<span class="c-warn">Error: File '${args[1]}' not found.</span>`;
                    }
                    break;

                case 'whoami':
                    response = "root";
                    break;

                case 'clear':
                    history.innerHTML = "";
                    break;
                
                case 'rf-scan':
                    startRfScan(); 
                    // rf-scan handles its own async output, so we don't set response immediately
                    break;

                case '':
                    break;

                default:
                    response = `bash: ${args[0]}: command not found`;
            }

            // 3. Append Response (if valid)
            if (response && args[0] !== 'clear') {
                const respLine = document.createElement('div');
                respLine.className = 'output-line';
                respLine.innerHTML = response;
                history.appendChild(respLine);
            }

            // 4. Reset & Scroll
            input.value = '';
            terminal.scrollTop = terminal.scrollHeight;
        }
    });

    /* --- 3. SIMULATED RF SCANNER FUNCTION --- */
    function startRfScan() {
        const id = Math.floor(Math.random() * 1000);
        let count = 0;
        
        // Disable input during scan
        input.disabled = true;
        
        const interval = setInterval(() => {
            const freq = (Math.random() * 800).toFixed(2);
            const db = -(Math.random() * 90).toFixed(1);
            
            const line = document.createElement('div');
            line.className = 'output-line c-dim';
            line.innerHTML = `[SDR-RTL] TUNING ${freq}MHz ... SIGNAL: ${db}dBm ... <span class="c-blue">LOCKING</span>`;
            history.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
            
            count++;
            if (count > 5) {
                clearInterval(interval);
                const done = document.createElement('div');
                done.className = 'output-line c-warn';
                done.innerText = "SCAN COMPLETE. 0 HANDSHAKES CAPTURED.";
                history.appendChild(done);
                terminal.scrollTop = terminal.scrollHeight;
                
                // Re-enable input and focus
                input.disabled = false;
                input.focus();
            }
        }, 200);
    }

    /* --- 4. FOCUS LOCK (KEEPS KEYBOARD OPEN) --- */
    document.addEventListener('click', () => {
        // Only focus if the user isn't selecting text (optional usability tweak)
        if (window.getSelection().toString() === "") {
            input.focus();
        }
    });
    
    // Initial focus
    input.focus();

</script>
</body>
</html>
